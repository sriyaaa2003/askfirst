[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askfirst"
version = "0.1.0"
description = "When should a replenishment system act alone and when should it ask a planner? Calibrated forecasts, expected value of review, and an autonomy frontier on Walmart M5 data."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
